<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Engineers' Day Treasure Hunt</title>
    <style>
        /* Blueprint / Tech Theme */
        :root {
            --bg-base: #0a1128;
            --grid-line: rgba(56, 189, 248, 0.15);
            --text-main: #e2e8f0;
            --text-blue: #38bdf8;
            --accent-orange: #fca5a5;
            --btn-orange: #f6c07a;
            --btn-orange-hover: #e5ad67;
            --box-bg: rgba(15, 23, 42, 0.85);
            --border-blue: rgba(56, 189, 248, 0.4);
            --white-box: #f8f6f0;
            --text-dark: #1e293b;
            --error: #ef4444;
            --success: #22c55e;
        }

        /* Anti-Cheat: Prevent text selection */
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-base);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 25px 25px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none; 
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Anti-Cheat Watermark */
        #watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; 
            z-index: 9999;
            display: none;
            overflow: hidden;
            opacity: 0.05;
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            word-wrap: break-word;
            line-height: 3;
            text-align: justify;
        }

        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-blue);
            padding-bottom: 10px;
        }

        .header-left { display: flex; flex-direction: column; }

        .stage-indicator {
            color: var(--text-blue);
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .team-display { font-size: 0.9rem; color: var(--text-main); }
        .timer-display { text-align: right; }
        
        .timer-label { font-size: 0.7rem; color: var(--text-blue); letter-spacing: 2px; text-transform: uppercase; }
        .time-value { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .timer-paused { color: var(--btn-orange); }

        .game-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }

        .registration-box {
            background-color: var(--box-bg);
            border: 1px solid var(--border-blue);
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }
        .registration-box h2 { margin-top: 0; color: var(--btn-orange); text-transform: uppercase; font-size: 1.2rem; margin-bottom: 20px; }

        .puzzle-box {
            background-color: var(--box-bg);
            border: 1px solid var(--border-blue);
            padding: 20px;
            position: relative;
            background-image: 
                linear-gradient(var(--border-blue), var(--border-blue)),
                linear-gradient(var(--border-blue), var(--border-blue));
            background-size: 10px 2px, 2px 10px;
            background-position: left top, left top;
            background-repeat: no-repeat;
        }

        .category-label { color: var(--accent-orange); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .puzzle-title { font-size: 1.4rem; font-weight: bold; color: #fff; margin-bottom: 15px; margin-top: 0; }
        .puzzle-text { font-size: 1rem; line-height: 1.5; margin-bottom: 20px; }
        
        .code-block {
            background-color: #050b14; padding: 15px; border-left: 3px solid var(--text-blue); font-family: 'Courier New', Courier, monospace; margin-bottom: 20px; white-space: pre-wrap;
        }

        .input-row { display: flex; align-items: stretch; background-color: #050b14; border: 1px solid var(--border-blue); }
        .input-prefix { padding: 12px 15px; color: var(--text-blue); background-color: #050b14; display: flex; align-items: center; }

        input[type="text"], select {
            flex-grow: 1; padding: 12px; background-color: transparent; border: none; color: #fff; font-family: inherit; font-size: 1rem; width: 100%;
        }
        
        .reg-input { border: 1px solid var(--border-blue) !important; margin-bottom: 15px; background-color: #050b14 !important; padding: 12px; box-sizing: border-box; }
        input:focus, select:focus { outline: none; }

        button { padding: 12px 20px; background-color: var(--btn-orange); color: var(--text-dark); border: none; font-size: 1rem; font-weight: bold; cursor: pointer; font-family: inherit; text-transform: uppercase; transition: background-color 0.2s; }
        button:hover { background-color: var(--btn-orange-hover); }
        button:disabled { background-color: #555; color: #222; cursor: not-allowed; }

        .feedback-text { margin-top: 10px; font-size: 0.9rem; min-height: 1.2rem; }
        .text-success { color: var(--success); }
        .text-error { color: var(--error); }

        .field-box { background-color: var(--white-box); color: var(--text-dark); padding: 20px; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: none; }
        .field-box.active { display: block; }
        .field-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .pin-icon { color: var(--error); font-size: 1.2rem; }
        .field-subtitle { font-size: 0.8rem; color: #a39b8b; letter-spacing: 2px; text-transform: uppercase; }
        .field-desc { font-size: 1rem; margin-bottom: 20px; line-height: 1.4; }
        .site-input-row { display: flex; background-color: #fff; border: 1px solid #ccc; }
        .site-input-row input { color: var(--text-dark); }
        .site-input-row button { background-color: var(--btn-orange); }

        #disqualified-screen { display: none; width: 100%; max-width: 600px; background-color: #450a0a; border: 2px solid var(--error); padding: 30px; text-align: center; border-radius: 8px; box-sizing: border-box; }
        #disqualified-screen h1 { color: var(--error); text-transform: uppercase; margin-top: 0;}
        #disqualified-screen p { color: #fca5a5; font-size: 1.1rem; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- Watermark layer for screenshot deterrence -->
    <div id="watermark-layer"></div>

    <!-- Header -->
    <div class="header" id="game-header" style="display: none;">
        <div class="header-left">
            <div class="stage-indicator" id="stage-display">STAGE 1/8</div>
            <div class="team-display" id="team-display">Team: [Name] | Sem: [X]</div>
        </div>
        <div class="timer-display">
            <div class="timer-label">TIME</div>
            <div class="time-value" id="time-display">00:00</div>
        </div>
    </div>

    <!-- Game Content Container -->
    <div class="game-container" id="game-container"></div>

    <!-- Disqualified Container -->
    <div id="disqualified-screen">
        <h1>SECURITY BREACH</h1>
        <p><strong>System Lockout Triggered.</strong></p>
        <p>Tab switching, minimizing the browser window, or backgrounding the application is strictly prohibited during the technical hunt.</p>
        <p>Your team has been disqualified. Please report to the organizers.</p>
    </div>

    <script>
        // ==========================================
        // UNIFIED DATABASE (Dynamic Routing)
        // ==========================================
        // This is correctly formatted as an Array of 8 shared locations.
        const db = [
            {
                siteCode: "ED-1001",
                fieldClue: "Where sparks may fly and metal meets its maker, I remain surrounded by the tools of creation. Machines roar, hands build, and raw materials slowly become something useful. I am hidden where engineers turn ideas into reality, but I am not a machine and cannot be built. Enter the place where making begins, search beyond the obvious, and let your engineering instincts lead you to the hidden clue.",
                easy: { category: "CAMPUS LOGIC", title: "The Main Gate", questionText: "Uncramble the following 3 words-> RITNMTSUEN WOARIBN NUKPERCYB (write them in this format-> word1 word2 word3 )", codeBlock: "", digitalAnswer: "INSTRUMENT RAINBOW CYBERPUNK" },
                tricky: { category: "CODE TRACING", title: "Predict the Output", questionText: "What is the output of this Python code?", codeBlock: "a = 5\na++\n++a\nprint(a)", digitalAnswer: "syntaxerror" }
            },
            {
                siteCode: "ED-1002",
                fieldClue: "When minds grow tired and conversations grow loud, people gather here for a different kind of fuel. But what you seek isn't something you can eat. Look where the break begins, yet search where no one thinks to look.",
                easy: { category: "BASIC MATH", title: "Canteen Calculation", questionText: "If 3 samosas cost ₹51, how much do 45 samosas cost?", codeBlock: "", digitalAnswer: "765" },
                tricky: { category: "LOGIC GATE", title: "Sensor Validation", questionText: "A = 1 if library faces East, else 0. B = 1 if Civil block pillars are round, else 0. What is A AND B?", codeBlock: "", digitalAnswer: "0" }
            },
            {
                siteCode: "ED-1003",
                fieldClue: "I carry no passengers, yet I hold the key to your next step. I travel with every journey, but my secret never changes. Look beyond the wheels and windows; sometimes the most important message is displayed where every vehicle proudly reveals its identity. Find the right bus, read what it bears",
                easy: { category: "MIND TEASER", title: "Farmers Cattle", questionText: "A farmer has 17 sheep, and all but 9 die. How many sheep are left?", codeBlock: "", digitalAnswer: "9" },
                tricky: { category: "RELATIONS", title: "Family come first", questionText: "Consider the relationships among P, Q, R, S, and T: P is the brother of Q, S is the daughter of Q,T is the sister of S, R is the mother of Q. The following statements are made based on the relationships given above. R is the grandmother of S, P is the uncle of S and T, R has only one son, Q has only one daughter.         How many of the above line are correct?", codeBlock: "", digitalAnswer: "2" }
            },
            {
                siteCode: "ED-1004",
                fieldClue: "Where iron rises but never walks, and numbers measure more than time, your next secret waits silently. Find the place where strength is tested, but don't let the strongest object distract you. Look carefully—your next step is hiding where effort meets endurance.",
                easy: { category: "HYPE MATH", title: "Gates", questionText: "A logic gate has inputs A=1, B=0, C=1. It implements the expression (A AND B) OR (NOT C). What is the output?", codeBlock: "", digitalAnswer: "0" },
                tricky: { category: "WAVES", title: "Frequency Modulation", questionText: "If a signal has a frequency of 50 Hz, what is its time period?", codeBlock: "", digitalAnswer: "0.02" }
            },
            {
                siteCode: "ED-1005",
                fieldClue: "I have a face full of numbers, yet I never solve an equation. I demand a sequence, but the sequence you seek is not the one I usually accept. I respond only when the right pattern is given. Find the place where digits become a language—and decode what they are hiding.",
                easy: { category: "LOGICAL", title: "Deep Well", questionText: "A snail is at the bottom of a 10-meter well. Each day it climbs 3 meters, but each night it slips back 2 meters. On which day does it reach the top?", codeBlock: "", digitalAnswer: "8" },
                tricky: { category: "LATERAL THINKING", title: "Its funny", questionText: "A man builds a rectangular house with all four walls facing south. A bear walks past. What color is the bear?", codeBlock: "", digitalAnswer: "white" }
            },
            {
                siteCode: "ED-1006",
                fieldClue: "I rest within a red cylinder, standing guard before a structure that has witnessed many chapters before the newer ones rose around it. Hidden inside me are countless grains of SiO₂, waiting to disrupt the chain reaction of combustion by depriving the flames of O₂.",
                easy: { category: "PUZZLE", title: "Physics of the Mind", questionText: "An electric train is moving north at 100 mph, and a strong wind is blowing west at 10 mph. What is the speed of the smoke [options-> 1)110km\h 2)90km\h 3)90.19km\h 4)none] (write only the option number)", codeBlock: "", digitalAnswer: "4" },
                tricky: { category: "KINEMATICS", title: "Velocity and Displacement", questionText: "A day can only be cloudy or sunny. The probability of a day being cloudy is 0.5, independent of the condition on other days. What is theprobability that in any given four days, there will be three cloudy days and one sunny day? (write in decimels like 0.03)", codeBlock: "", digitalAnswer: "0.25" }
            },
            {
                siteCode: "ED-1007",
                fieldClue: "I hold thousands of voices, yet I never speak. I am surrounded by knowledge, but the answer you seek isn't meant to be read from a page. Where silence speaks louder than words, your next clue awaits.",
                easy: { category: "PUZZLE", title: "Alphabetic Nightmare", questionText: "How many 'E's appear in this sentence: 'Every engineer eventually experiences several excellent achievements'?", codeBlock: "", digitalAnswer: "19" },
                tricky: { category: "ATTENTION TO DETAIL", title: "Sentence Parsing", questionText: "How many 'E's appear in this sentence: 'Every engineer eventually experiences several excellent achievements but its not in his mind to be exemplarily extraordinary'?", codeBlock: "", digitalAnswer: "12" }
            },
            {
                siteCode: "ED-1008",
                fieldClue: "Its name promises wisdom, but most come here to relax, gossip, and watch time pass. 😏 Today, however, it has something worth finding. Forget the name—look around the place where people come to sit, and your next clue may be closer than you think.",
                easy: { category: "PUZZLE", title: "CIPHER", questionText: "If CAT is coded as DCW and DOG is coded as EQJ, then what is the code for TERRACE?", codeBlock: "", digitalAnswer: "uguvfil" },
                tricky: { category: "LOGICAL", title: "Deep Well (Tricky)", questionText: "A snail is at the bottom of a 18.1-meter well. Each day it climbs 3 meters, but each night it slips back 2 meters. On which day does it reach the top?", codeBlock: "", digitalAnswer: "16" }
            }
        ];

        // ==========================================
        // GAME STATE & LOGIC
        // ==========================================
        let teamInfo = { name: "", sem: "" };
        let activeStages = []; 
        let currentIndex = 0;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let isTimerRunning = false;
        
        let isGameActive = false; 

        const container = document.getElementById('game-container');
        const header = document.getElementById('game-header');
        const timeDisplay = document.getElementById('time-display');
        const watermark = document.getElementById('watermark-layer');
        const disqualifiedScreen = document.getElementById('disqualified-screen');

        // Security Checks 
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && isGameActive) { triggerDisqualification(); }
        });

        window.addEventListener("blur", () => {
            if (isGameActive) { triggerDisqualification(); }
        });

        function triggerDisqualification() {
            pingServer("DISQUALIFIED");

            isGameActive = false;
            isTimerRunning = false;
            clearInterval(timerInterval);
            
            header.style.display = "none";
            container.style.display = "none";
            watermark.style.display = "none";
            disqualifiedScreen.style.display = "block";
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function showRegistration() {
            container.innerHTML = `
                <div class="registration-box">
                    <h2>System Login / Team Setup</h2>
                    <p style="color: var(--error); font-size: 0.85rem; margin-top: -10px; margin-bottom: 15px;">
                        ⚠️ WARNING: Once initialized, changing tabs or leaving this browser will result in immediate disqualification.
                    </p>
                    <input type="text" id="reg-name" class="reg-input" placeholder="Enter Team Name..." required autocomplete="off">
                    <select id="reg-sem" class="reg-input">
                        <option value="1">1st Semester (Newcomers)</option>
                        <option value="3">3rd Semester</option>
                        <option value="5">5th Semester</option>
                        <option value="7">7th Semester</option>
                    </select>
                    <button onclick="initializeGame()" style="width: 100%;">Initialize Hunt</button>
                    <div id="reg-feedback" class="feedback-text text-error"></div>
                </div>
            `;
        }

        function initializeGame() {
            const name = document.getElementById('reg-name').value.trim();
            const sem = document.getElementById('reg-sem').value;

            if (!name) {
                document.getElementById('reg-feedback').textContent = "Error: Team name required.";
                return;
            }

            try { document.documentElement.requestFullscreen(); } catch (e) {}

            teamInfo.name = name;
            teamInfo.sem = sem;
            isGameActive = true; 

            const wmText = `${name} • `.repeat(200);
            watermark.textContent = wmText;
            watermark.style.display = "block";

            // Properly generate the 8 stages from the new array structure
            activeStages = shuffleArray(db).slice(0, 8);

            document.getElementById('team-display').textContent = `Team: ${name} | Sem: ${sem}`;
            header.style.display = "flex";

            isTimerRunning = true;
            timerInterval = setInterval(() => {
                if(isTimerRunning) {
                    elapsedSeconds++;
                    updateTimerUI();
                    // NEW: Ping server every 5 seconds
                    if (elapsedSeconds % 5 === 0) pingServer("PLAYING"); 
                }
            }, 1000);

            renderStage();
            // NEW: Initial start ping
            pingServer("STARTED");
        }

        function updateTimerUI() {
            const m = Math.floor(elapsedSeconds / 60);
            const s = elapsedSeconds % 60;
            timeDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            
            if(!isTimerRunning) timeDisplay.classList.add('timer-paused');
            else timeDisplay.classList.remove('timer-paused');
        }

        function renderStage() {
            if (currentIndex >= activeStages.length) {
                renderVictory();
                return;
            }

            const stageData = activeStages[currentIndex];
            
            // Dynamic check based on saved semester
            const q = (teamInfo.sem === "1") ? stageData.easy : stageData.tricky;
            
            document.getElementById('stage-display').textContent = `STAGE ${currentIndex + 1}/${activeStages.length}`;

            const codeHTML = q.codeBlock ? `<div class="code-block">${q.codeBlock}</div>` : '';

            container.innerHTML = `
                <div class="puzzle-box">
                    <div class="category-label">${q.category}</div>
                    <h2 class="puzzle-title">${q.title}</h2>
                    <div class="puzzle-text">${q.questionText}</div>
                    ${codeHTML}
                    
                    <div class="input-row">
                        <span class="input-prefix">ANSWER></span>
                        <input type="text" id="digital-answer" autocomplete="off">
                        <button id="digital-submit" onclick="verifyDigital()">SUBMIT</button>
                    </div>
                    <div id="digital-feedback" class="feedback-text text-success"></div>
                </div>

                <div class="field-box" id="field-clue-box">
                    <div class="field-header">
                        <span class="pin-icon">📍</span>
                        <span class="field-subtitle">FIELD CLUE</span>
                    </div>
                    
                    <div class="field-desc">${stageData.fieldClue}</div>
                    
                    <div class="field-subtitle" style="margin-bottom: 5px;">SITE CODE</div>
                    <div style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">Find the card posted at that location and type the code on it.</div>
                    
                    <div class="site-input-row">
                        <input type="text" id="site-code" placeholder="ED-XXXX" autocomplete="off">
                        <button onclick="verifySiteCode()">UNLOCK</button>
                    </div>
                    <div id="site-feedback" class="feedback-text text-error"></div>
                </div>
            `;
        }

        function verifyDigital() {
            const inputEl = document.getElementById('digital-answer');
            const btnEl = document.getElementById('digital-submit');
            const feedback = document.getElementById('digital-feedback');
            const userAns = inputEl.value.trim().toLowerCase();
            
            const currentStage = activeStages[currentIndex];
            const correctAns = (teamInfo.sem === "1") ? currentStage.easy.digitalAnswer.toLowerCase() : currentStage.tricky.digitalAnswer.toLowerCase();

            if (userAns === correctAns) {
                feedback.textContent = "Correct — your field clue is unlocked below. Timer paused.";
                feedback.className = "feedback-text text-success";
                
                inputEl.disabled = true;
                btnEl.disabled = true;
                isTimerRunning = false;
                updateTimerUI();

                document.getElementById('field-clue-box').classList.add('active');
                window.scrollBy({ top: 150, behavior: 'smooth' });
            } else {
                feedback.textContent = "Incorrect output. Try again.";
                feedback.className = "feedback-text text-error";
            }
        }

        function verifySiteCode() {
            const feedback = document.getElementById('site-feedback');
            const userAns = document.getElementById('site-code').value.trim().toUpperCase();
            const correctAns = activeStages[currentIndex].siteCode.toUpperCase();

            if (userAns === correctAns) {
                feedback.textContent = "Access Granted. Loading next stage...";
                feedback.className = "feedback-text text-success";
                
                setTimeout(() => {
                    currentIndex++;
                    isTimerRunning = true; 
                    updateTimerUI();
                    
                    // NEW: Ping server to update admin dashboard on stage advance
                    pingServer("STAGE UNLOCKED");
                    
                    renderStage();
                }, 1000);
            } else {
                feedback.textContent = "Invalid Site Code.";
            }
        }

        function renderVictory() {
            pingServer("FINISHED");

            isGameActive = false; 
            isTimerRunning = false;
            
            clearInterval(timerInterval);
            
            watermark.style.display = "none"; 
            document.getElementById('stage-display').textContent = `HUNT COMPLETE`;

            container.innerHTML = `
                <div class="puzzle-box" style="text-align: center;">
                    <div class="category-label" style="color: var(--success);">MISSION ACCOMPLISHED</div>
                    <h2 class="puzzle-title">System Override Complete</h2>
                    <div class="puzzle-text">
                        Excellent work, <strong>Team ${teamInfo.name}</strong>.<br>
                        You have successfully completed all 8 stages.
                    </div>
                    
                    <div style="font-size: 3rem; color: var(--success); font-weight: bold; margin: 20px 0;">
                        ${timeDisplay.textContent}
                    </div>
                    
                    <div style="color: var(--btn-orange); font-size: 0.9rem;">
                        Screenshot this interface as proof of completion and report back to base.
                    </div>
                </div>
            `;
        }

        showRegistration();

        const API_URL = 'https://iste-eday-backend.onrender.com/api/update';

        function pingServer(statusOverride) {
            if (!teamInfo.name) return; 
            let currentStatus = isGameActive ? "PLAYING" : "LOCKED";
            if (statusOverride) currentStatus = statusOverride;

            // HARDCODE THE URL DIRECTLY HERE:
            fetch('https://iste-eday-backend.onrender.com/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: teamInfo.name,
                    sem: teamInfo.sem,
                    stage: currentIndex + 1,
                    time: elapsedSeconds,
                    status: currentStatus
                })
            }).catch(err => console.log("Offline fail", err));
        }
    </script>
</body>
</html>
